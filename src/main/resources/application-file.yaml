spring:
  application:
    name: inventory-api-file

logging:
  level:
    com.quickcoders.inventory.api: INFO
    org.springframework.web: INFO

server:
  port: 8080

# Configurações de arquivos de dados para o perfil file
app:
  data:
    file:
      items: data/items.json
      inventory: data/inventory.json
      reservations: data/reservations.json
      idempotency: data/idempotency.json
