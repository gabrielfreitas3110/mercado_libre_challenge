spring:
  application:
    name: inventory-api-file

# Configuração File (Persistência JSON)
app:
  security:
    jwt:
      enabled: true
      secret: local-secret-key-change-in-production
      expiration: 3600
  data:
    file:
      items: data/items.json
      inventory: data/inventory.json
      reservations: data/reservations.json
      idempotency: data/idempotency.json

# Logging para perfil file
logging:
  level:
    com.quickcoders.inventory.api: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    com.quickcoders.inventory.api.repository.file: DEBUG

# Cache Configuration
app:
  cache:
    ttl: 8s
    max-size: 1000

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        inventory.operations.reservation: true
        inventory.operations.commit: true
        inventory.operations.release: true
        inventory.operations.adjust: true

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
