spring:
  application:
    name: inventory-api-dev

# Configuração Dev (Sem Autenticação)
app:
  security:
    jwt:
      enabled: false  # JWT desabilitado para desenvolvimento
      secret: dev-secret-key
      expiration: 3600

# Logging para desenvolvimento
logging:
  level:
    com.quickcoders.inventory.api: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.scheduling: DEBUG

# Cache Configuration
app:
  cache:
    ttl: 8s
    max-size: 1000

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        inventory.operations.reservation: true
        inventory.operations.commit: true
        inventory.operations.release: true
        inventory.operations.adjust: true

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
