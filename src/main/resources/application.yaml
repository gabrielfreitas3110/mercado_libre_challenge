spring:
  application:
    name: inventory-api
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: postgres
    password: postgresql
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.quickcoders.infolabsproducts: INFO
    org.springframework.security: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{correlationId}] [%X{userId}] - %msg%n"

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

inventory:
  idempotency:
    ttl: PT24H
  cache:
    ttl: 8s
  scheduler:
    reservation-expiry: "0 */1 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        inventory_read_latency: true
        inventory_write_latency: true
        inventory.operations.reservation: true
        inventory.operations.commit: true
        inventory.operations.release: true
        inventory.operations.adjust: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        inventory_read_latency: 0.5,0.95,0.99
        inventory_write_latency: 0.5,0.95,0.99
  prometheus:
    metrics:
      export:
        enabled: true

app:
  security:
    jwt:
      enabled: false
      secret: local-secret-key-change-in-production
      expiration: 3600
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true
