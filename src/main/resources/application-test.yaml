spring:
  application:
    name: inventory-api-test

logging:
  level:
    com.quickcoders.inventory.api: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN

# Test Configuration
app:
  security:
    jwt:
      enabled: false  # Disable JWT for tests
      secret: test-secret-key
      expiration: 3600

# Actuator Configuration for Tests
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    metrics:
      enabled: true
