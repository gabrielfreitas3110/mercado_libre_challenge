spring:
  application:
    name: inventory-api-prod

# Production Profile Configuration
app:
  security:
    jwt:
      enabled: true
      secret: ${JWT_SECRET:change-me-in-production}
      expiration: ${JWT_EXPIRATION:3600}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://api.example.com}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE}
      allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Correlation-Id,Idempotency-Key}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.quickcoders.infolabsproducts: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
